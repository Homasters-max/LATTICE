# Verdict of every PR of LATTICE: a call of the reusable workflow of WARRANT by the tag of
# the CLI (SRA docs/06-verification.md §8; Change pin-v0-10-0, design D-3), no copy of the
# job here. The tag is the same in `uses` and in the input `warrant` (test/process/pin.test.ts).
# `setup: npm ci` — typescript for the structure test. The check in GitHub is `warrant / warrant`.
name: warrant

on:
  pull_request:
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "Merge commit M of the impl-PR on the default branch"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: warrant-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit || 'run' }}
  cancel-in-progress: true

jobs:
  warrant:
    name: warrant
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    uses: Homasters-max/SRA/.github/workflows/warrant.yml@v0.10.0
    with:
      warrant: v0.10.0
      setup: npm ci
      merge_commit: ${{ inputs.merge_commit || '' }}
