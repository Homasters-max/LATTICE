# Verdict of every PR of LATTICE (WARRANT ADR-0039 п. 6, ADR-0044 п. 7): a call of
# the reusable workflow warrant.yml of WARRANT by the tag of the CLI, no copy of
# the job here (SRA docs/06-verification.md §8). The tag is the same in `uses` and
# in the input `warrant`; a new tag is a factory-change Change of this project.
# The check in GitHub is named `warrant / warrant`. A red job is the maintainer's
# signal not to merge (no branch protection).
name: warrant

on:
  pull_request:
  # Recovery run of an impl-PR after its merge (WARRANT ADR-0037 п. 4): its
  # evidence is STALE (main moved before the merge) or the artifact expired.
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "Merge commit M of the impl-PR on the default branch"
        required: true
        type: string

# `warrant ci` reads PRs, runs, artifacts and PR comments of this repository
# through gh with github.token of the caller.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: warrant-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.merge_commit || 'run' }}
  cancel-in-progress: true

jobs:
  warrant:
    name: warrant
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    uses: Homasters-max/SRA/.github/workflows/warrant.yml@v0.8.2
    with:
      warrant: v0.8.2
      setup: npm ci
      merge_commit: ${{ inputs.merge_commit || '' }}
